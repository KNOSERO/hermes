---
- name: Set backup archive names
  ansible.builtin.set_fact:
    backup_stem: "{{ hermes_name }}-{{ (backup_label | default('', true) ~ '-') if (backup_label | default('', true) | length > 0) else '' }}{{ backup_stamp }}"
    backup_partial: "/backups/{{ hermes_name }}-{{ (backup_label | default('', true) ~ '-') if (backup_label | default('', true) | length > 0) else '' }}{{ backup_stamp }}.zip.partial"
    backup_final: "/backups/{{ hermes_name }}-{{ (backup_label | default('', true) ~ '-') if (backup_label | default('', true) | length > 0) else '' }}{{ backup_stamp }}.zip"

- name: Find the Hermes pod
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ hermes_namespace }}"
      - get
      - pods
      - -l
      - "app={{ hermes_name }}"
      - -o
      - json
  register: hermes_pods
  changed_when: false

- name: Select running Hermes pods
  ansible.builtin.set_fact:
    running_hermes_pods: "{{ (hermes_pods.stdout | from_json).items | selectattr('status.phase', 'equalto', 'Running') | list }}"

- name: Require a running Hermes pod
  ansible.builtin.assert:
    that: running_hermes_pods | length > 0
    fail_msg: "No running Hermes pod is available to create a backup."

- name: Select a running Hermes pod
  ansible.builtin.set_fact:
    hermes_pod: "{{ running_hermes_pods[0].metadata.name }}"

- name: Create backup inside Hermes
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ hermes_namespace }}"
      - exec
      - "{{ hermes_pod }}"
      - --
      - /opt/hermes/docker/main-wrapper.sh
      - backup
      - --output
      - "/tmp/{{ backup_stem }}.zip"
  register: backup_command
  changed_when: true
  failed_when: false

- name: Copy backup archive from the Hermes pod
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ hermes_namespace }}"
      - cp
      - "{{ hermes_pod }}:/tmp/{{ backup_stem }}.zip"
      - "{{ backup_partial }}"
  register: backup_copy
  changed_when: true
  failed_when: false

- name: Fail when Hermes backup or archive transfer failed
  ansible.builtin.fail:
    msg: "Backup failed. Any partial archive remains under /backups with a .partial suffix."
  when: backup_command.rc != 0 or backup_copy.rc != 0

- name: Verify backup archive integrity
  ansible.builtin.command:
    argv: [unzip, -t, "{{ backup_partial }}"]
  changed_when: false

- name: Publish complete backup archive
  ansible.builtin.command:
    argv: [mv, "{{ backup_partial }}", "{{ backup_final }}"]
  changed_when: true

- name: Remember archive name for update and rollback
  ansible.builtin.set_fact:
    backup_archive: "{{ backup_final | basename }}"

- name: Show backup path
  ansible.builtin.debug:
    msg: "Backup saved to /backups/{{ backup_archive }}"

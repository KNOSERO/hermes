---
- name: Read rollback information
  ansible.builtin.include_vars:
    file: "/backups/{{ hermes_name }}-rollback.json"
    name: rollback

- name: Confirm rollback snapshot exists
  ansible.builtin.stat:
    path: "/backups/{{ rollback.snapshot }}"
  register: rollback_archive

- name: Reject missing or incomplete rollback snapshot
  ansible.builtin.assert:
    that:
      - rollback_archive.stat.exists
      - not rollback.snapshot.endswith('.partial')
    fail_msg: "The rollback snapshot is missing or incomplete."

- name: Back up current Hermes data before rollback
  ansible.builtin.include_tasks: backup.yml
  vars:
    backup_label: before-rollback

- name: Restore the pre-update data snapshot
  ansible.builtin.include_tasks: restore-data.yml
  vars:
    restore_archive: "{{ rollback.snapshot }}"

- name: Run Hermes with the previous image
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: "{{ hermes_name }}"
        namespace: "{{ hermes_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: "{{ hermes_name }}"
        template:
          metadata:
            labels:
              app: "{{ hermes_name }}"
          spec:
            containers:
              - name: hermes
                image: "{{ rollback.image }}"
                imagePullPolicy: IfNotPresent
                args: [gateway, run]
                volumeMounts:
                  - name: data
                    mountPath: "{{ hermes_data_path }}"
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: "{{ hermes_name }}"

- name: Wait for rollback rollout
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ hermes_namespace }}"
      - rollout
      - status
      - "statefulset/{{ hermes_name }}"
      - --timeout=180s
  changed_when: false

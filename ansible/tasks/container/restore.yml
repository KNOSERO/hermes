---
- name: Snapshot current Hermes data before restore
  ansible.builtin.include_tasks: backup.yml
  vars:
    backup_label: before-restore

- name: Check for the Hermes Desktop server before restore
  community.docker.docker_container_info:
    name: "{{ hermes_desktop_name }}"
    docker_host: "{{ docker_host }}"
    use_ssh_client: true
  register: hermes_desktop_container

- name: Stop the Hermes Desktop server before restore
  community.docker.docker_container:
    name: "{{ hermes_desktop_name }}"
    state: stopped
    docker_host: "{{ docker_host }}"
    use_ssh_client: true
  when: hermes_desktop_container.exists

- name: Replace Hermes data from the selected archive
  ansible.builtin.include_tasks: restore-data.yml

- name: Start Hermes gateway with restored data
  ansible.builtin.include_tasks: gateway.yml

- name: Restart Hermes Desktop connection after restore
  ansible.builtin.include_tasks: connect.yml

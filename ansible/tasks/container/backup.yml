---
- name: Set backup archive names
  ansible.builtin.set_fact:
    backup_stem: "{{ hermes_name }}-{{ (backup_label | default('', true) ~ '-') if (backup_label | default('', true) | length > 0) else '' }}{{ backup_stamp }}"
    backup_partial: "/backups/{{ hermes_name }}-{{ (backup_label | default('', true) ~ '-') if (backup_label | default('', true) | length > 0) else '' }}{{ backup_stamp }}.zip.partial"
    backup_final: "/backups/{{ hermes_name }}-{{ (backup_label | default('', true) ~ '-') if (backup_label | default('', true) | length > 0) else '' }}{{ backup_stamp }}.zip"
    backup_helper: "{{ hermes_name }}-backup-{{ backup_stamp }}"

- name: Create and copy a full Hermes backup
  block:
    - name: Create temporary backup container
      ansible.builtin.command:
        argv:
          - docker
          - create
          - --name
          - "{{ backup_helper }}"
          - --volume
          - "{{ hermes_name }}:{{ hermes_data_path }}"
          - "{{ hermes_image }}"
          - backup
          - --output
          - "/tmp/{{ backup_stem }}.zip"
      changed_when: true

    - name: Write the archive from Hermes data
      ansible.builtin.command:
        argv: [docker, start, -a, "{{ backup_helper }}"]
      changed_when: true

    - name: Copy the archive into the local backup folder
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - "{{ backup_helper }}:/tmp/{{ backup_stem }}.zip"
          - "{{ backup_partial }}"
      changed_when: true

    - name: Check that the archive is complete
      ansible.builtin.command:
        argv: [unzip, -t, "{{ backup_partial }}"]
      changed_when: false

    - name: Publish the complete archive
      ansible.builtin.command:
        argv: [mv, "{{ backup_partial }}", "{{ backup_final }}"]
      changed_when: true

    - name: Remember the archive name for update and rollback
      ansible.builtin.set_fact:
        backup_archive: "{{ backup_final | basename }}"

  rescue:
    - name: Keep an incomplete archive for inspection
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - "{{ backup_helper }}:/tmp/{{ backup_stem }}.zip"
          - "{{ backup_partial }}"
      failed_when: false
      changed_when: false

    - name: Report the backup failure
      ansible.builtin.fail:
        msg: "Backup failed. Any partial archive remains under /backups with a .partial suffix."

  always:
    - name: Remove temporary backup container
      ansible.builtin.command:
        argv: [docker, rm, -f, "{{ backup_helper }}"]
      failed_when: false
      changed_when: false

- name: Show the backup path
  ansible.builtin.debug:
    msg: "Backup saved to /backups/{{ backup_archive }}"

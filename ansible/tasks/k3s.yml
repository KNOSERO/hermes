---
- name: Install Hermes on k3s
  ansible.builtin.include_tasks: k3s/install.yml
  when: hermes_action == 'install'

- name: Start Hermes gateway on k3s
  ansible.builtin.include_tasks: k3s/gateway.yml
  when: hermes_action == 'run' and run_mode == 'gateway'

- name: Stop Hermes services on k3s
  ansible.builtin.include_tasks: k3s/stop.yml
  when: hermes_action == 'stop'

- name: Connect Hermes Desktop on k3s
  ansible.builtin.include_tasks: k3s/connect.yml
  when: hermes_action == 'connect'

- name: Back up Hermes data on k3s
  ansible.builtin.include_tasks: k3s/backup.yml
  when: hermes_action == 'backup' and not ansible_check_mode

- name: Restore Hermes data on k3s
  ansible.builtin.include_tasks: k3s/restore.yml
  when: hermes_action == 'restore' and not ansible_check_mode

- name: Update Hermes on k3s
  ansible.builtin.include_tasks: k3s/update.yml
  when: hermes_action == 'update' and not ansible_check_mode

- name: Roll back Hermes on k3s
  ansible.builtin.include_tasks: k3s/rollback.yml
  when: hermes_action == 'rollback' and not ansible_check_mode

- name: Skip state-changing action in check mode
  ansible.builtin.debug:
    msg: "{{ hermes_action }} changes persistent data and is not run in check mode."
  when: ansible_check_mode and hermes_action in ['backup', 'restore', 'update', 'rollback']
